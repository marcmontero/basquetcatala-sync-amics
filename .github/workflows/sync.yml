name: Sync calendaris (amics)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Instal·la dependències
        run: python3 -m pip install -r requirements.txt

      - name: Escriu les credencials de Google
        run: echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Sincronitza
        env:
          GOOGLE_CREDENTIALS_PATH: credentials.json
        run: python3 sync_calendar.py

      - name: Puja captura de depuració (si ha fallat)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore

      - name: Neteja credencials
        if: always()
        run: rm -f credentials.json
